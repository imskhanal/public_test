<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quick Question</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e78ae2, #f07d7d);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            color: white;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2.5rem;
        }

        .yes-btn {
            padding: 20px 50px;
            font-size: 24px;
            border: none;
            border-radius: 50px;
            background: #00e676;
            color: #000;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .yes-btn:hover {
            transform: scale(1.1);
        }

        .no-btn {
            position: absolute;
            padding: 8px 18px;
            font-size: 14px;
            border: none;
            border-radius: 20px;
            background: #1e0ec4;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Will you be my valentine? 😏</h1>
        <button class="yes-btn" onclick="yesClicked()">YES</button>
    </div>

    <button class="no-btn" id="noBtn">NO</button>

    <script>
        const noBtn = document.getElementById("noBtn");

        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - 80);
            const y = Math.random() * (window.innerHeight - 40);

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        // Move constantly every 700ms
        setInterval(moveNoButton, 700);

        function yesClicked() {
            alert("I love you😄❤️");
        }
    </script>

</body>
</html>
